<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>WhatsApp Test Interface</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">••• 📶 🔋</span>
    </div>

    <header class="chat-header">
      <svg class="icon back-icon" viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="avatar">🏥</div>
      <div class="contact-info">
        <div class="contact-name">Hospital Assistant</div>
        <div class="contact-status">online</div>
      </div>
      <div class="header-icons">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M23 7l-7 5 7 5V7z" fill="white"/>
          <rect x="1" y="5" width="15" height="14" rx="2" fill="white"/>
        </svg>
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M6.6 10.8c1.4 2.7 3.6 4.9 6.3 6.3l2.1-2.1c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1l-2.3 2.3z" fill="white"/>
        </svg>
      </div>
    </header>

    <main class="chat-body" id="chatBody"></main>

    <footer class="chat-input">
      <div class="input-row">
        <svg class="icon plus-icon" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" stroke="#54656f" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="textInput" type="text" placeholder="Message" autocomplete="off" />
        <svg class="icon attach-icon" viewBox="0 0 24 24">
          <path d="M21.4 11.4L12 20.8a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8" stroke="#54656f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <button id="sendBtn" class="send-btn" aria-label="Send">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M3 20l18-8L3 4v6l12 2-12 2v6z" fill="white"/>
        </svg>
      </button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
