apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aismb-whatsapp
  namespace: aismb-health
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aismb-whatsapp
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

