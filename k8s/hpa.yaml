apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aismb-whatsapp
  namespace: aismb-health
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aismb-whatsapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aismb-interface
  namespace: aismb-health
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aismb-interface
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
