# ---------------------------------------------------------------------------
# TEMPLATE ONLY — do not `kubectl apply` this file directly with the literal
# REPLACE_ME values. Instead, populate the real secret from your .env:
#
#   ./create-secret.sh            # reads ../.env (only active, non-commented keys)
#   ./create-secret.sh /path/.env # or pass a custom env file
#
# The keys below are the ACTIVE entries from .env (commented-out LangChain /
# NVIDIA / APP_ENV / PORT lines are intentionally excluded). They map 1:1 to
# the environment variables the application reads (os.getenv(...)) and are
# injected into the pods via `envFrom: secretRef`.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: aismb-secrets
  namespace: aismb-health
type: Opaque
stringData:
  # LLM
  GEMINI_API_KEY: "REPLACE_ME"
  GEMINI_MODEL: "gemini-3.6-flash"
  GEMINI_TEMPERATURE: "0.3"
  # Graph (Neo4j Aura)
  NEO4J_URI: "REPLACE_ME"
  NEO4J_USERNAME: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME"
  NEO4J_DATABASE: "REPLACE_ME"
  AURA_INSTANCEID: "REPLACE_ME"
  AURA_INSTANCENAME: "REPLACE_ME"
  # Relational DB (Supabase Postgres)
  DB_HOST: "REPLACE_ME"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  # WhatsApp / Meta Cloud API
  PHONE_NUMBER_ID: "REPLACE_ME"
  WABA_ID: "REPLACE_ME"
  ACCESS_TOKEN: "REPLACE_ME"
  VERIFY_TOKEN: "REPLACE_ME"
  WEBHOOK_SECRET: "REPLACE_ME"
  # Speech-to-Text (Sarvam AI — used; supports Indian languages)
  SARVAM_API_KEY: "REPLACE_ME"
  # Speech-to-Text (Deepgram — kept but unused by the app)
  DEEPGRAM_API_KEY: "REPLACE_ME"
