apiVersion: apps/v1
kind: Deployment
metadata:
  name: aismb-interface
  namespace: aismb-health
  labels:
    app: aismb-interface
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aismb-interface
  template:
    metadata:
      labels:
        app: aismb-interface
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: aismb-whatsapp
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.azure.com/agentpool: agentpool
      containers:
        - name: aismb-interface
          image: hsptlagnrgstry.azurecr.io/aismb-health:latest
          command: ["python", "-m", "uvicorn", "interface.app:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - secretRef:
                name: aismb-secrets
          env:
            - name: PORT
              value: "8001"
          resources:
            requests:
              cpu: 1500m
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 10Gi
          startupProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
